name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Habilita pnpm vía corepack respetando la versión fijada en
      # package.json ("packageManager"), sin hardcodear una versión acá.
      - name: Enable corepack
        run: corepack enable

      # pnpm 11 requiere Node >= 22.13.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/api importa tipos generados por Prisma; sin este paso el
      # typecheck y el build de la API fallan. No requiere DB ni DATABASE_URL.
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
